name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # mypy no longer runs on 3.9: lint on the newest version only; check_skills skips it elsewhere.
      - name: Install ruff and mypy
        if: matrix.python == '3.12'
        run: python -m pip install ruff==0.17.2 mypy==2.4.0
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -t .
      - name: Repository checks
        run: python tools/check_skills.py

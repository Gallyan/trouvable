# Lint and type-check settings for the repository (scripts themselves need nothing installed).
# Run: python3 tools/lint.py  (ruff and mypy are used when installed; check_skills.py calls it)

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["skills/*/scripts/seokit", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C90", "SIM", "PIE"]
# B905: zip(strict=) needs Python 3.10. SIM117: parenthesised context managers need 3.10.
ignore = ["B905", "SIM117"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
# mypy no longer accepts 3.9 as a target; check_skills.py guards 3.9 syntax separately.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
